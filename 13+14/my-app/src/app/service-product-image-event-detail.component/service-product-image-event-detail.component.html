<div style="border: 1px solid black; width: 200px; padding: 10px; text-align: center;">
  <button (click)="goBack()">Go Back</button>
  
  <table *ngIf="selectedProduct" style="margin-top: 10px; text-align: left; width: 100%;">
    <tr>
      <td>ID:</td>
      <td>{{ selectedProduct.ProductId }}</td>
    </tr>
    <tr>
      <td>Name:</td>
      <td>{{ selectedProduct.ProductName }}</td>
    </tr>
    <tr>
      <td>Price:</td>
      <td>{{ selectedProduct.Price }}</td>
    </tr>
    <tr>
      <td colspan="2" style="text-align: center; padding-top: 10px;">
        <img [src]="selectedProduct.Image" width="100" height="100" style="object-fit: contain;"/>
      </td>
    </tr>
  </table>
</div>
